[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "summit-commit"
dynamic = ["version"]
description = "AI-powered git commit messages from staged diffs (SUMmarize + comMIT)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SUMmit contributors" }]
keywords = ["git", "commit", "conventional-commits", "llm", "ollama", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control :: Git",
    "Typing :: Typed",
]

dependencies = [
    "typer>=0.12,<1.0",
    "rich>=13.0,<15.0",
    "GitPython>=3.1,<4.0",
    "ollama>=0.3,<1.0",
    "openai>=1.0,<2.0",
    "pydantic-settings>=2.0,<3.0",
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<7.0",
    "mypy>=1.10,<2.0",
    "ruff>=0.5,<1.0",
]

[project.scripts]
summit = "summit.cli:app"

[project.urls]
Homepage = "https://github.com/Bluxo1/SUMmit"
Repository = "https://github.com/Bluxo1/SUMmit"
Issues = "https://github.com/Bluxo1/SUMmit/issues"

[tool.hatch.version]
path = "src/summit/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/summit"]

[tool.hatch.build.targets.sdist]
include = ["src/summit", "tests", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=summit --cov-report=term-missing"
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/summit"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
files = ["src/summit"]

[[tool.mypy.overrides]]
module = ["git.*", "ollama.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "ANN", # flake8-annotations (type hints everywhere)
    "S",   # flake8-bandit (security)
    "T20", # flake8-print (no print statements)
    "SIM", # flake8-simplify
    "PTH", # flake8-use-pathlib (no os.path)
    "RET", # flake8-return
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ANN"] # asserts and loose annotations are fine in tests

[tool.ruff.lint.pydocstyle]
convention = "google"
